{% extends "admin_base.html" %}
{% block title %}Admin Login - Splitmate{% endblock %}

{% block content %}
<div class="admin-login-wrap">
    <div class="auth-card admin-login-card">
        <div class="auth-header">
            <h1>Admin sign in</h1>
            <p>Use the admin-only email. It works here, not in the Splitmate app.</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Admin email</label>
                <input type="email" id="email" name="email" required
                       maxlength="120" placeholder="admin@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="********" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Sign in to admin</button>
        </form>

        <div class="auth-footer">
            <p><a href="{{ url_for('admin.setup') }}">First time, or forgot the password?</a></p>
            <p><a href="{{ url_for('auth.login') }}">Go to Splitmate app login</a></p>
        </div>
    </div>
</div>
{% endblock %}
