# Render Blueprint: deploys the Flask backend (Splitmate-Web) with a PostgreSQL database,
# plus a web build of the Expo app (Splitmate-App) that runs in a phone browser.
# In Render: New > Blueprint > pick this repo. Fill in the "sync: false" values when asked.
services:
  - type: web
    name: splitmate-web
    runtime: python
    rootDir: Splitmate-Web
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: splitmate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY_SEED
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # The web build of the app (splitmate-app below) calls the API from the browser.
      # If Render gives the static site a different address, update this value.
      - key: MOBILE_API_CORS_ORIGINS
        value: https://splitmate-app.onrender.com

  # Web build of the Expo app, for using Splitmate in a phone browser (Safari: Share > Add to Home Screen).
  - type: web
    name: splitmate-app
    runtime: static
    rootDir: Splitmate-App
    buildCommand: npm ci && EXPO_PUBLIC_SPLITMATE_API_URL="https://$BACKEND_HOST/api/mobile" npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_HOST
        fromService:
          type: web
          name: splitmate-web
          property: host

databases:
  - name: splitmate-db
    databaseName: splitmate
    plan: free
