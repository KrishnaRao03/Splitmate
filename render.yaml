# Render Blueprint: deploys the Flask backend (Splitmate-Web) with a PostgreSQL database.
# In Render: New > Blueprint > pick this repo. Fill in the "sync: false" values when asked.
services:
  - type: web
    name: splitmate-web
    runtime: python
    rootDir: Splitmate-Web
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: splitmate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY_SEED
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: splitmate-db
    databaseName: splitmate
    plan: free
