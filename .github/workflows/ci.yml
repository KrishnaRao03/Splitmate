name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Splitmate-Web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Splitmate-Web
    env:
      SECRET_KEY: ci-only-secret
      INACTIVITY_EMAILS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Splitmate-Web/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  app:
    name: Splitmate-App typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Splitmate-App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Splitmate-App/package-lock.json
      - run: npm ci
      - run: npm run typecheck
